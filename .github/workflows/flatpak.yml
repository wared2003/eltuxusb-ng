name: Flatpak

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      - name: Add flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME SDK and Platform 51
        run: flatpak install --user --noninteractive flathub org.gnome.Sdk//51 org.gnome.Platform//51

      - name: Build the flatpak
        run: flatpak-builder --user --force-clean --repo=repo build-dir flatpak/com.github.eltuxusb.eltuxusb.json

      - name: Export a single-file bundle
        run: flatpak build-bundle repo com.github.eltuxusb.eltuxusb.flatpak com.github.eltuxusb.eltuxusb master

      - name: Upload the bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.eltuxusb.eltuxusb.flatpak
          path: com.github.eltuxusb.eltuxusb.flatpak

      - name: Attach the bundle to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: com.github.eltuxusb.eltuxusb.flatpak
