name: Flatpak

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  flatpak:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      - name: Add flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME SDK and Platform 51
        run: flatpak install --user --noninteractive flathub org.gnome.Sdk//51 org.gnome.Platform//51

      - name: Import the repository signing key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          if [ -z "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" ]; then
            echo "Secret FLATPAK_GPG_PRIVATE_KEY is missing (paste the raw armored private key, not base64)"
            exit 1
          fi
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --batch --list-secret-keys 73015E7FEDCE7BFD91624423CE1D8D02552368D2

      - name: Build the flatpak repository (signed)
        run: flatpak-builder --user --gpg-sign=73015E7FEDCE7BFD91624423CE1D8D02552368D2 --force-clean --repo=repo build-dir flatpak/com.github.eltuxusb.eltuxusb.json

      - name: Publish the public key alongside the repository
        run: cp flatpak/eltuxusb-repo.gpg repo/

      - name: Export a single-file bundle
        run: flatpak build-bundle --gpg-sign=73015E7FEDCE7BFD91624423CE1D8D02552368D2 repo com.github.eltuxusb.eltuxusb.flatpak com.github.eltuxusb.eltuxusb master

      - name: Upload the bundle to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: com.github.eltuxusb.eltuxusb.flatpak

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload the repository as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
